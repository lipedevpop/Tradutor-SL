name: Testar, gerar instalador e publicar

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'installer/**'
      - 'tools/**'
      - 'tests/**'
      - 'release-notes/**'
      - 'iniciar.py'
      - '.github/workflows/publicar.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradutor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar dependências de compilação
        run: python -m pip install -r app/requirements.txt
      - name: Testar aplicativo e atualizador
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s app -v
      - name: Gerar instalador e pacotes
        run: |
          $version = python -c "import sys; sys.path.insert(0,'tools'); from prepare_release import app_version; print(app_version())"
          $base = python -c "import sys; print(sys.base_prefix)"
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          python tools/build_windows_installer.py --version $version --build-dir work/build --output dist --base-python $base --dependency-sites $site
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci_release.py plan --dist dist
      - name: Verificar se a versão pode ser publicada
        id: release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ci_release.py gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pacotes-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publicar:
    needs: construir
    if: needs.construir.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pacotes-windows
          path: dist
      - name: Publicar somente após conferir os anexos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_release.py publish --dist dist
